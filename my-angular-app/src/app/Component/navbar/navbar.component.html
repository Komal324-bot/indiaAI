
<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-logo">
      <img src="assets/indiaAI-logo.png" alt="Logo" class="logo" />
    </div>

    <ul class="navbar-menu">
      <li class="nav-item">Home</li>
    
      <li class="nav-item">About Scheme</li>
      <li class="nav-item">Guidelines</li>
      <li class="nav-item">Eligibility Criteria</li>
      <li class="nav-item">Contact Us</li>
    </ul>
    
    <div class="navbar-buttons">
      <button class="btn login-btn" (click)="showLoginPopup = true">
      Login Now
     </button>
      <button class="btn register-btn" (click)="showRegisterPopup=true">
      Register</button>
    </div>
  </div>

  <!-- Register -->

  <div *ngIf="showRegisterPopup" class="popup-overlay">
    <div class="popup-content">
      <div class="in"><img src="/assets/indiaAI-logo.png"/></div>
      <br>
      <h2>Register Here!</h2>
      <form (submit)="submitRegister()">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required />
        <br>
        <label for="password">Enter Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required />
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" [(ngModel)]="confirmPassword" name="confirmPassword" required />

        <button type="submit" class="btn login-btn">Submit</button>
        <button type="button" (click)="showRegisterPopup = false"
        class="btn cancel-btn">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Login -->
   
  <div *ngIf="showLoginPopup" class="popup-overlay">
    <div class="popup-content">
      <div class="in"><img src="/assets/indiaAI-logo.png"/></div>
      <br>
      <h2>Login</h2>
      <form (submit)="submitLogin()">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required />
        <br>
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required />
        <button type="submit" class="btn login-btn">Submit</button>
        <button type="button" (click)="showLoginPopup = false" class="btn cancel-btn">Cancel</button>
      </form>
    </div>
  </div>
</nav>
